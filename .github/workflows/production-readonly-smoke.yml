name: Production Read-Only Acceptance Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify public read-only contract without credentials
        run: |
          python operational_smoke.py https://ai-project-assistant-0u1f.onrender.com
