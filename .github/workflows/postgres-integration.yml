name: PostgreSQL Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration_only_ci
          POSTGRES_DB: approval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d approval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
      TEST_DATABASE_URL: postgresql://integration:integration_only_ci@localhost:5432/approval_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3,<4"
      - name: Run PostgreSQL integration tests against disposable service
        run: |
          python -m unittest -v \
            test_postgres_integration \
            test_operation_coordinator_integration \
            test_atomic_coordinator_integration \
            test_recovery_workflow_integration
