name: Python automated tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/phase4b-approval-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        env:
          APPROVAL_SIGNING_KEY: test-only-signing-key-not-for-production-123456789
        run: python -m unittest discover -s . -p 'test_*.py' -v
